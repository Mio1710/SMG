openapi: 3.0.0
info:
  title: Miodium API
  description: Miodium API Documentation
  version: 1.0.0

servers:
  - url: http://localhost:3000/api
    description: Local development server

tags:
  - name: Auth
    description: Auth API
  - name: users
    description: Users API

paths:
  # [POST] Login
  /auth/login:
    post:
      tags:
        - Auth
      summary: Login User
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/schemas/auth/login"
      responses:
        200:
          description: "OK"
        400:
          description: "Bad Request"
        401:
          description: "Unauthorized"
        500:
          description: "Server Error"
  # [POST] Register
  /auth/register:
    post:
      tags:
        - Auth
      summary: Register User
      parameters:
        - name: body
          in: body
          description: user Data
          required: true
          schema:
            type: object
            properties:
              email:
                type: string
                description: user Email
              password:
                type: string
                description: user Password
      responses:
        201:
          description: "Created"
        400:
          description: "Bad Request"
        409:
          description: "Conflict"
        500:
          description: "Server Error"

  # [GET] Get User
  /users/{id}:
    get:
      tags:
        - users
      summary: Get User by ID
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: User ID
      responses:
        200:
          description: "OK"
        404:
          description: "Not Found"
        500:
          description: "Server Error"

    put:
      tags:
        - users
      summary: Update User by ID
      parameters:
        - name: id
          in: path
          required: true
          type: string
          description: User ID
        - name: body
          in: body
          description: user Data to update
          required: true
          schema:
            $ref: "#/schemas/users"
      responses:
        200:
          description: "OK"
        400:
          description: "Bad Request"
        404:
          description: "Not Found"
        500:
          description: "Server Error"
# Schema Definitions
schemas:
  auth:
    login:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: user Email
        password:
          type: string
          description: user Password
  users:
    type: object
    required:
      - email
      - password
    properties:
      email:
        type: string
        description: user Email
      password:
        type: string
        description: user Password

schemes:
  - https
  - http
